plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kopykata.portfoliodeck'
    compileSdk 34

    defaultConfig {
        applicationId "com.kopykata.portfoliodeck"
        minSdk 24
        targetSdk 34
        versionCode 8
        versionName "1.8.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
